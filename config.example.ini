; Starmaker collector - database configuration template
; Copy this file to config.ini (same directory) and fill in real values.
; config.ini is git-ignored, so real credentials never enter the repository.

[mongodb]
; Connection string.
; Special characters in user/password MUST be URL-encoded (e.g. # -> %23).
; Local example: uri = mongodb://root:P%40ss@localhost:27017/
uri = mongodb://USER:PASSWORD@localhost:27017/

; Database name used by the collector.
db = starmaker
